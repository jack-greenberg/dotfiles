theme = "monochrome"

[editor]
auto-format = true
cursorline = true
lsp.display-inlay-hints = true
true-color = true

[editor.soft-wrap]
enable = true

[editor.inline-diagnostics]
cursor-line = "info"

[editor.indent-guides]
render = true
skip-levels = 0

[editor.file-picker]
hidden = false

[keys.normal]
# Goto the nearest upstream Cargo.toml
space.o = ":o %sh{nearest-cargo.sh %{buffer_name}}"
# Print the current line's git blame information to the statusline.
space.B = ":sh git blame -L %{cursor_line},+1 %{buffer_name}"
"C-r" = ":reload-all"
ret = "goto_word"
# Reflow a paragraph
"C-p" = "@mip:reflow<ret>"
